name: ic_upstream4
number: 4

# === CAMPOS ADICIONADOS PARA COMPATIBILIDADE DE SCHEMA ===
model_path: null
normalizer_path: null
imputationMethod: null

model:
  name: ft_transformer
  d_embedding: 128
  token_bias: true
  n_layers: 1
  n_heads: 16
  d_ffn_factor: 1.3333333333
  attention_dropout: 0.2
  ffn_dropout: 0.1
  residual_dropout: 0.0
  activation: gelu
  prenormalization: true
  initialization: kaiming

hyp:
  epochs: 200
  lr: 2.3875087429508465e-05
